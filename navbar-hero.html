<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox Navbar and Hero</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #172033;
      background: #f3f6fc;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      padding: 20px 7%;
      background: white;
    }
    .logo { font-size: 22px; font-weight: 800; color: #2457d6; }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .nav-links a { color: #263247; text-decoration: none; }
    .hero {
      min-height: calc(100vh - 70px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 18px;
      padding: 48px 24px;
      text-align: center;
      background: linear-gradient(135deg, #e4edff, #f7f9ff);
    }
    .hero h1 { max-width: 700px; margin: 0; font-size: clamp(36px, 6vw, 60px); }
    .hero p { max-width: 560px; margin: 0; color: #526071; line-height: 1.6; }
    .hero a {
      display: inline-block;
      margin-top: 8px;
      padding: 13px 22px;
      border-radius: 8px;
      color: white;
      background: #2457d6;
      text-decoration: none;
      font-weight: bold;
    }
    @media (max-width: 520px) {
      .navbar { flex-direction: column; }
      .nav-links { flex-wrap: wrap; justify-content: center; gap: 14px; }
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="logo">FlexSpace</div>
    <nav class="nav-links" aria-label="Main navigation">
      <a href="#">Home</a>
      <a href="#">Features</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main class="hero">
    <h1>Build Better Layouts with Flexbox</h1>
    <p>Arrange content, align elements, and create responsive page layouts with a few powerful CSS properties.</p>
    <a href="#">Explore More</a>
  </main>
</body>
</html>
